name: ai_asisstan
description: AI Asistan uygulamas1.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  # Veritabanı
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  # Şifreleme
  encrypt: ^5.0.1
  crypto: ^3.0.3
  # State Management - Riverpod
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  # Router
  go_router: ^13.2.0
  # UI
  material_color_utilities: ^0.11.1
  # Supabase
  supabase_flutter: ^2.3.4
  # Google Sign-In
  google_sign_in: ^6.2.0
  # Web Auth (Windows için)
  flutter_web_auth: ^0.5.0
  url_launcher: ^6.2.2
  # HTML Parser (For Base64 decoding)
  html: ^0.15.4
  # HTML Renderer
  flutter_html: ^3.0.0
  # HTML to Widget renderer (better HTML support)
  flutter_widget_from_html: ^0.17.1
  # Yardımcı
  intl: ^0.18.1
  uuid: ^4.2.1
  json_annotation: ^4.8.1
  shared_preferences: ^2.2.2
  # Grafikler
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/